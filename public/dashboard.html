<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - إشارتك</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', sans-serif;
      background: #f1f5f9;
      padding: 24px;
    }
    .dashboard-container {
      max-width: 1400px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .logout-btn {
      background: #ef4444;
      padding: 8px 20px;
      border: none;
      border-radius: 40px;
      color: white;
      cursor: pointer;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: white;
      padding: 24px;
      border-radius: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .section {
      background: white;
      border-radius: 28px;
      padding: 24px;
      margin-bottom: 40px;
    }
    h2 { margin-bottom: 20px; }
    table {
      width: 100%;
      border-collapse: collapse;
      overflow-x: auto;
      display: block;
    }
    th, td {
      padding: 12px;
      text-align: right;
      border-bottom: 1px solid #e2e8f0;
    }
    th {
      background: #f8fafc;
    }
    video {
      width: 100px;
      border-radius: 12px;
    }
    button {
      padding: 6px 12px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      margin: 4px;
    }
    .approve { background: #10b981; color: white; }
    .reject { background: #f59e0b; color: white; }
    .delete { background: #ef4444; color: white; }
    .edit { background: #3b82f6; color: white; }
    .form-card {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 20px;
      align-items: flex-end;
    }
    .form-card input, .form-card select {
      padding: 10px;
      border-radius: 20px;
      border: 1px solid #cbd5e1;
      font-family: inherit;
    }
    .upload-btn {
      background: #2563eb;
      color: white;
      padding: 10px 24px;
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-content {
      background: white;
      border-radius: 32px;
      padding: 32px;
      width: 90%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
      position: relative;
      animation: modalSlideIn 0.3s ease;
    }
    @keyframes modalSlideIn {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .modal-header h2 {
      font-size: 24px;
      margin: 0;
    }
    .close-modal {
      background: none;
      border: none;
      font-size: 28px;
      cursor: pointer;
      color: #64748b;
      padding: 0;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .close-modal:hover {
      background: rgba(0,0,0,0.05);
    }
    .modal-form-group {
      margin-bottom: 20px;
    }
    .modal-form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .modal-form-group input,
    .modal-form-group select,
    .modal-form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      font-family: inherit;
      font-size: 14px;
    }
    .modal-form-group textarea {
      resize: vertical;
    }
    .current-video {
      margin-top: 8px;
      font-size: 12px;
      color: #64748b;
    }
    .current-video video {
      width: 100%;
      height: auto;
      margin-top: 8px;
    }
    .save-btn {
      background: #10b981;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 40px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 16px;
    }
    .save-btn:hover {
      background: #059669;
    }
    .loading {
      opacity: 0.6;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      body { padding: 16px; }
      th, td { padding: 8px; font-size: 14px; }
      video { width: 60px; }
      .form-card input, .form-card select { width: 100%; }
      .modal-content { padding: 20px; }
    }
  </style>
</head>
<body>
<div class="dashboard-container">
  <div class="header">
    <h1>📊 لوحة تحكم إشارتك</h1>
    <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="section">
    <h2>🕒 طلبات الإشارات (قيد المراجعة)</h2>
    <div id="submissionsTable"></div>
  </div>

  <div class="section">
    <h2>✅ الإشارات المعتمدة</h2>
    <div id="signsTable"></div>
  </div>

  <div class="section">
    <h2>➕ رفع إشارة رسمية جديدة</h2>
    <div class="form-card">
      <input type="text" id="newDest" placeholder="الوجهة" style="flex:2; min-width:150px;">
      <select id="newGov" style="flex:1; min-width:120px;">
        <option value="القاهرة">القاهرة</option>
        <option value="الإسكندرية">الإسكندرية</option>
      </select>
      <input type="file" id="newVideo" accept="video/*" style="flex:2; min-width:200px;">
      <input type="text" id="newDesc" placeholder="وصف الإشارة" style="flex:2; min-width:150px;">
      <button onclick="uploadOfficialSign()" class="upload-btn" style="flex:0;">📤 رفع</button>
    </div>
  </div>
</div>

<!-- Modal for editing sign -->
<div class="modal-overlay" id="editModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>✏️ تعديل الإشارة</h2>
      <button class="close-modal" onclick="closeEditModal()">✕</button>
    </div>
    <form id="editForm">
      <div class="modal-form-group">
        <label>الوجهة *</label>
        <input type="text" id="editDestName" required placeholder="اسم الوجهة">
      </div>
      <div class="modal-form-group">
        <label>المحافظة *</label>
        <select id="editGovernorate" required>
          <option value="القاهرة">القاهرة</option>
          <option value="الإسكندرية">الإسكندرية</option>
        </select>
      </div>
      <div class="modal-form-group">
        <label>الوصف</label>
        <textarea id="editDescription" rows="3" placeholder="وصف الإشارة..."></textarea>
      </div>
      <div class="modal-form-group">
        <label>الفيديو الحالي</label>
        <div class="current-video" id="currentVideoPreview"></div>
        <label style="margin-top: 12px;">تغيير الفيديو (اختياري)</label>
        <input type="file" id="editVideo" accept="video/*">
      </div>
      <button type="button" class="save-btn" id="saveBtn" onclick="saveEdit()">💾 حفظ التغييرات</button>
    </form>
  </div>
</div>

<script>
  const API_URL = window.location.origin;
  let token = localStorage.getItem('token');
  let currentEditId = null;
  let currentVideoUrl = null;

  if (!token) window.location.href = '/login.html';

  async function fetchWithAuth(url, options = {}) {
    const res = await fetch(url, {
      ...options,
      headers: { ...options.headers, 'Authorization': `Bearer ${token}` }
    });
    if (res.status === 401 || res.status === 403) {
      localStorage.removeItem('token');
      window.location.href = '/login.html';
    }
    return res;
  }

  function showMessage(msg, isError = false) {
    const existing = document.querySelector('.dashboard-message');
    if (existing) existing.remove();
    const div = document.createElement('div');
    div.className = 'dashboard-message';
    div.textContent = msg;
    div.style.cssText = `position:fixed; bottom:20px; right:20px; background:${isError ? '#ef4444' : '#10b981'}; color:white; padding:12px 24px; border-radius:40px; z-index:1000; animation:fadeOut 3s forwards;`;
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 3000);
  }

  async function loadDashboard() {
    try {
      const subRes = await fetchWithAuth(`${API_URL}/api/submissions`);
      const submissions = await subRes.json();
      const pending = submissions.filter(s => s.status === 'pending');
      const approved = submissions.filter(s => s.status === 'approved');
      
      document.getElementById('stats').innerHTML = `
        <div class="stat-card">⏳ قيد المراجعة: ${pending.length}</div>
        <div class="stat-card">✅ تمت الموافقة: ${approved.length}</div>
        <div class="stat-card">📋 إجمالي الطلبات: ${submissions.length}</div>
      `;
      
      let subHtml = '<table><thead><tr><th>الوجهة</th><th>المحافظة</th><th>فيديو</th><th>ملاحظات</th><th>إجراءات</th></tr></thead><tbody>';
      if (pending.length === 0) {
        subHtml += '<tr><td colspan="5" style="text-align:center;">✨ لا توجد طلبات معلقة</td></tr>';
      } else {
        pending.forEach(s => {
          subHtml += `<tr>
            <td>${escapeHtml(s.destinationName)}</td>
            <td>${escapeHtml(s.governorate)}</td>
            <td><video src="${s.videoUrl}" controls width="100"></video></td>
            <td>${escapeHtml(s.notes) || '-'}</td>
            <td>
              <button class="approve" onclick="approve('${s.id}')">قبول</button>
              <button class="reject" onclick="reject('${s.id}')">رفض</button>
              </td>
           </tr>`;
        });
      }
      subHtml += '</tbody></table>';
      document.getElementById('submissionsTable').innerHTML = subHtml;

      const signsRes = await fetch(`${API_URL}/api/signs`);
      const signs = await signsRes.json();
      let signsHtml = '<table><thead><tr><th>الوجهة</th><th>المحافظة</th><th>فيديو</th><th>الإجراءات</th></tr></thead><tbody>';
      if (signs.length === 0) {
        signsHtml += '<tr><td colspan="4" style="text-align:center;">📭 لا توجد إشارات معتمدة بعد</td></tr>';
      } else {
        signs.forEach(s => {
          signsHtml += `<tr>
            <td>${escapeHtml(s.destinationName)}</td>
            <td>${escapeHtml(s.governorate)}</td>
            <td><video src="${s.videoUrl}" controls width="100"></video></td>
            <td>
              <button class="delete" onclick="deleteSign('${s.id}')">حذف</button>
              <button class="edit" onclick="openEditModal('${s.id}', '${escapeHtml(s.destinationName)}', '${escapeHtml(s.governorate)}', '${escapeHtml(s.description || '')}', '${s.videoUrl}')">تعديل</button>
              </td>
           </tr>`;
        });
      }
      signsHtml += '</tbody><tr>';
      document.getElementById('signsTable').innerHTML = signsHtml;
    } catch (err) {
      showMessage('حدث خطأ في تحميل البيانات', true);
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // Open Edit Modal
  function openEditModal(id, name, gov, desc, videoUrl) {
    currentEditId = id;
    currentVideoUrl = videoUrl;
    document.getElementById('editDestName').value = name;
    document.getElementById('editGovernorate').value = gov;
    document.getElementById('editDescription').value = desc;
    document.getElementById('editVideo').value = '';
    
    const previewDiv = document.getElementById('currentVideoPreview');
    previewDiv.innerHTML = `<video src="${videoUrl}" controls width="100%"></video>`;
    
    document.getElementById('editModal').classList.add('active');
  }

  function closeEditModal() {
    document.getElementById('editModal').classList.remove('active');
    currentEditId = null;
    currentVideoUrl = null;
    document.getElementById('editVideo').value = '';
  }

  // Save Edit - Official implementation using PUT and PATCH
  async function saveEdit() {
    const newName = document.getElementById('editDestName').value.trim();
    const newGov = document.getElementById('editGovernorate').value;
    const newDesc = document.getElementById('editDescription').value.trim();
    const newVideoFile = document.getElementById('editVideo').files[0];
    const saveBtn = document.getElementById('saveBtn');

    if (!newName) {
      showMessage('يرجى إدخال اسم الوجهة', true);
      return;
    }

    // Disable button to prevent double submission
    saveBtn.disabled = true;
    saveBtn.textContent = 'جاري الحفظ...';

    try {
      // 1. Update text fields first
      await fetchWithAuth(`${API_URL}/api/signs/${currentEditId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          destinationName: newName, 
          governorate: newGov, 
          description: newDesc 
        })
      });
      
      // 2. If there's a new video, update it using PATCH
      if (newVideoFile) {
        const formData = new FormData();
        formData.append('video', newVideoFile);
        
        await fetchWithAuth(`${API_URL}/api/signs/${currentEditId}/video`, {
          method: 'PATCH',
          body: formData
        });
        showMessage('✅ تم تعديل الإشارة والفيديو بنجاح');
      } else {
        showMessage('✅ تم تعديل الإشارة بنجاح');
      }
      
      closeEditModal();
      loadDashboard();
    } catch (err) {
      console.error('Save error:', err);
      showMessage('فشل التعديل، حاول مرة أخرى', true);
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = '💾 حفظ التغييرات';
    }
  }

  async function approve(id) {
    if (confirm('هل تريد قبول هذه الإشارة ونشرها للجميع؟')) {
      await fetchWithAuth(`${API_URL}/api/submissions/${id}/approve`, { method: 'POST' });
      showMessage('✅ تم قبول الإشارة ونشرها');
      loadDashboard();
    }
  }
  
  async function reject(id) {
    if (confirm('هل تريد رفض هذه الإشارة؟')) {
      await fetchWithAuth(`${API_URL}/api/submissions/${id}/reject`, { method: 'POST' });
      showMessage('❌ تم رفض الإشارة');
      loadDashboard();
    }
  }
  
  async function deleteSign(id) {
    if (confirm('⚠️ حذف الإشارة نهائياً؟ لا يمكن التراجع!')) {
      await fetchWithAuth(`${API_URL}/api/signs/${id}`, { method: 'DELETE' });
      showMessage('🗑️ تم حذف الإشارة');
      loadDashboard();
    }
  }
  
  async function uploadOfficialSign() {
    const destName = document.getElementById('newDest').value.trim();
    const governorate = document.getElementById('newGov').value;
    const videoFile = document.getElementById('newVideo').files[0];
    const description = document.getElementById('newDesc').value.trim();

    if (!destName) {
      showMessage('يرجى إدخال اسم الوجهة', true);
      return;
    }
    if (!videoFile) {
      showMessage('يرجى اختيار فيديو للإشارة', true);
      return;
    }

    const formData = new FormData();
    formData.append('destinationName', destName);
    formData.append('governorate', governorate);
    formData.append('video', videoFile);
    formData.append('description', description);

    try {
      await fetchWithAuth(`${API_URL}/api/signs`, { method: 'POST', body: formData });
      showMessage('✅ تمت إضافة الإشارة بنجاح');
      document.getElementById('newDest').value = '';
      document.getElementById('newVideo').value = '';
      document.getElementById('newDesc').value = '';
      loadDashboard();
    } catch (err) {
      showMessage('فشل الرفع، تأكد من الفيديو', true);
    }
  }
  
  function logout() {
    localStorage.removeItem('token');
    window.location.href = '/login.html';
  }

  // Close modal when clicking outside
  document.getElementById('editModal').addEventListener('click', (e) => {
    if (e.target === document.getElementById('editModal')) {
      closeEditModal();
    }
  });

  loadDashboard();
</script>
</body>
</html>
