<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - إشارتك</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', sans-serif;
      background: #f1f5f9;
      padding: 24px;
    }
    .dashboard-container {
      max-width: 1400px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }
    .logout-btn {
      background: #ef4444;
      padding: 8px 20px;
      border: none;
      border-radius: 40px;
      color: white;
      cursor: pointer;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: white;
      padding: 24px;
      border-radius: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .section {
      background: white;
      border-radius: 28px;
      padding: 24px;
      margin-bottom: 40px;
    }
    h2 { margin-bottom: 20px; }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 12px;
      text-align: right;
      border-bottom: 1px solid #e2e8f0;
    }
    video {
      width: 100px;
      border-radius: 12px;
    }
    button {
      padding: 6px 12px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      margin: 4px;
    }
    .approve { background: #10b981; color: white; }
    .reject { background: #f59e0b; color: white; }
    .delete { background: #ef4444; color: white; }
    .edit { background: #3b82f6; color: white; }
    .form-card {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .form-card input, .form-card select {
      padding: 10px;
      border-radius: 20px;
      border: 1px solid #cbd5e1;
    }
  </style>
</head>
<body>
<div class="dashboard-container">
  <div class="header">
    <h1>📊 لوحة تحكم إشارتك</h1>
    <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="section">
    <h2>🕒 طلبات الإشارات (قيد المراجعة)</h2>
    <div id="submissionsTable"></div>
  </div>

  <div class="section">
    <h2>✅ الإشارات المعتمدة</h2>
    <div id="signsTable"></div>
  </div>

  <div class="section">
    <h2>➕ رفع إشارة رسمية جديدة</h2>
    <div class="form-card">
      <input type="text" id="newDest" placeholder="الوجهة">
      <select id="newGov">
        <option>القاهرة</option><option>الجيزة</option><option>الإسكندرية</option>
        <option>الشرقية</option><option>الدقهلية</option>
      </select>
      <input type="file" id="newVideo" accept="video/*">
      <input type="text" id="newDesc" placeholder="وصف">
      <button onclick="uploadOfficialSign()">رفع الإشارة</button>
    </div>
  </div>
</div>

<script>
  const API_URL = window.location.origin;
  let token = localStorage.getItem('token');
  if (!token) window.location.href = '/login.html';

  async function fetchWithAuth(url, options = {}) {
    const res = await fetch(url, {
      ...options,
      headers: { ...options.headers, 'Authorization': `Bearer ${token}` }
    });
    if (res.status === 401 || res.status === 403) {
      localStorage.removeItem('token');
      window.location.href = '/login.html';
    }
    return res;
  }

  async function loadDashboard() {
    // Load submissions
    const subRes = await fetchWithAuth(`${API_URL}/api/submissions`);
    const submissions = await subRes.json();
    const pending = submissions.filter(s => s.status === 'pending');
    document.getElementById('stats').innerHTML = `
      <div class="stat-card">⏳ قيد المراجعة: ${pending.length}</div>
      <div class="stat-card">✅ إشارات معتمدة: ${submissions.filter(s=>s.status==='approved').length}</div>
      <div class="stat-card">📋 إجمالي الطلبات: ${submissions.length}</div>
    `;
    
    let subHtml = '<table><tr><th>الوجهة</th><th>المحافظة</th><th>فيديو</th><th>ملاحظات</th><th>إجراءات</th></tr>';
    pending.forEach(s => {
      subHtml += `<tr>
        <td>${s.destinationName}</td>
        <td>${s.governorate}</td>
        <td><video src="${s.videoUrl}" controls width="100"></video></td>
        <td>${s.notes || '-'}</td>
        <td><button class="approve" onclick="approve('${s.id}')">قبول</button>
        <button class="reject" onclick="reject('${s.id}')">رفض</button></td>
      </tr>`;
    });
    subHtml += '</table>';
    document.getElementById('submissionsTable').innerHTML = subHtml || '<p>لا توجد طلبات معلقة</p>';

    // Load signs
    const signsRes = await fetch(`${API_URL}/api/signs`);
    const signs = await signsRes.json();
    let signsHtml = '<table><tr><th>الوجهة</th><th>المحافظة</th><th>فيديو</th><th>الإجراءات</th></tr>';
    signs.forEach(s => {
      signsHtml += `<tr>
        <td>${s.destinationName}</td>
        <td>${s.governorate}</td>
        <td><video src="${s.videoUrl}" controls width="100"></video></td>
        <td><button class="delete" onclick="deleteSign('${s.id}')">حذف</button>
        <button class="edit" onclick="editSign('${s.id}','${s.destinationName}','${s.governorate}')">تعديل</button></td>
      </tr>`;
    });
    signsHtml += '</table>';
    document.getElementById('signsTable').innerHTML = signsHtml;
  }

  async function approve(id) {
    await fetchWithAuth(`${API_URL}/api/submissions/${id}/approve`, { method: 'POST' });
    loadDashboard();
  }
  async function reject(id) {
    await fetchWithAuth(`${API_URL}/api/submissions/${id}/reject`, { method: 'POST' });
    loadDashboard();
  }
  async function deleteSign(id) {
    if (confirm('حذف الإشارة نهائياً؟')) {
      await fetchWithAuth(`${API_URL}/api/signs/${id}`, { method: 'DELETE' });
      loadDashboard();
    }
  }
  async function uploadOfficialSign() {
    const formData = new FormData();
    formData.append('destinationName', document.getElementById('newDest').value);
    formData.append('governorate', document.getElementById('newGov').value);
    formData.append('video', document.getElementById('newVideo').files[0]);
    formData.append('description', document.getElementById('newDesc').value);
    await fetchWithAuth(`${API_URL}/api/signs`, { method: 'POST', body: formData });
    alert('تمت الإضافة');
    loadDashboard();
  }
  function editSign(id, name, gov) {
    const newName = prompt('الاسم الجديد:', name);
    if (newName) {
      fetchWithAuth(`${API_URL}/api/signs/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ destinationName: newName, governorate: gov })
      }).then(() => loadDashboard());
    }
  }
  function logout() {
    localStorage.removeItem('token');
    window.location.href = '/login.html';
  }
  loadDashboard();
</script>
</body>
</html>
