<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>لوحة التحكم - إشارتك</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, 'Cairo', sans-serif;
      background: #f1f5f9;
      padding: 16px;
    }
    .dashboard-container {
      max-width: 1400px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 { font-size: clamp(20px, 5vw, 28px); }
    .logout-btn {
      background: #ef4444;
      padding: 8px 20px;
      border: none;
      border-radius: 40px;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 24px;
      text-align: center;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .section {
      background: white;
      border-radius: 28px;
      padding: 20px;
      margin-bottom: 30px;
      overflow-x: auto; /* مهم للجداول على الموبايل */
    }
    h2 { font-size: 20px; margin-bottom: 16px; }
    
    /* Responsive Table */
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px; /* يخلي الجدول يتحرك يمين/شمال لو ضاقت الشاشة */
    }
    th, td {
      padding: 12px 8px;
      text-align: right;
      border-bottom: 1px solid #e2e8f0;
      font-size: 14px;
    }
    th { background: #f8fafc; }
    video { width: 80px; border-radius: 8px; }
    button {
      padding: 6px 12px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin: 2px;
      font-size: 12px;
    }
    .approve { background: #10b981; color: white; }
    .reject { background: #f59e0b; color: white; }
    .delete { background: #ef4444; color: white; }
    .edit { background: #3b82f6; color: white; }
    
    /* Form Card */
    .form-card {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .form-card input, .form-card select {
      padding: 12px;
      border-radius: 40px;
      border: 1px solid #cbd5e1;
      flex: 1 1 auto;
      min-width: 120px;
    }
    .upload-btn {
      background: #2563eb;
      color: white;
      padding: 10px 20px;
      border-radius: 40px;
      border: none;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: white;
      border-radius: 32px;
      padding: 24px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .close-modal {
      background: none;
      border: none;
      font-size: 28px;
      cursor: pointer;
    }
    .modal-form-group { margin-bottom: 16px; }
    .modal-form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
    .modal-form-group input, .modal-form-group select, .modal-form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 20px;
      font-family: inherit;
    }
    .save-btn {
      background: #10b981;
      color: white;
      padding: 12px;
      border-radius: 40px;
      width: 100%;
      border: none;
      font-weight: bold;
      margin-top: 8px;
    }
    .current-video video { width: 100%; margin-top: 8px; }

    @media (max-width: 640px) {
      body { padding: 12px; }
      .section { padding: 16px; }
      th, td { padding: 8px 4px; font-size: 12px; }
      button { padding: 4px 8px; font-size: 11px; }
      .form-card input, .form-card select { width: 100%; }
    }
  </style>
</head>
<body>
<div class="dashboard-container">
  <div class="header">
    <h1>📊 لوحة تحكم إشارتك</h1>
    <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="section">
    <h2>🕒 طلبات الإشارات (قيد المراجعة)</h2>
    <div id="submissionsTable"></div>
  </div>

  <div class="section">
    <h2>✅ الإشارات المعتمدة</h2>
    <div id="signsTable"></div>
  </div>

  <div class="section">
    <h2>➕ رفع إشارة رسمية جديدة</h2>
    <div class="form-card">
      <input type="text" id="newDest" placeholder="الوجهة">
      <select id="newGov">
        <option value="القاهرة">القاهرة</option>
        <option value="الإسكندرية">الإسكندرية</option>
      </select>
      <input type="file" id="newVideo" accept="video/*">
      <input type="text" id="newDesc" placeholder="وصف الإشارة">
      <button onclick="uploadOfficialSign()" class="upload-btn">📤 رفع</button>
    </div>
  </div>
</div>

<!-- Modal for edit -->
<div class="modal-overlay" id="editModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>✏️ تعديل الإشارة</h2>
      <button class="close-modal" onclick="closeEditModal()">✕</button>
    </div>
    <div class="modal-form-group">
      <label>الوجهة</label>
      <input type="text" id="editDestName">
    </div>
    <div class="modal-form-group">
      <label>المحافظة</label>
      <select id="editGovernorate"><option>القاهرة</option><option>الإسكندرية</option></select>
    </div>
    <div class="modal-form-group">
      <label>الوصف</label>
      <textarea id="editDescription" rows="3"></textarea>
    </div>
    <div class="modal-form-group">
      <label>الفيديو الحالي</label>
      <div class="current-video" id="currentVideoPreview"></div>
      <label style="margin-top:10px;">تغيير الفيديو (اختياري)</label>
      <input type="file" id="editVideo" accept="video/*">
    </div>
    <button class="save-btn" id="saveBtn" onclick="saveEdit()">💾 حفظ التغييرات</button>
  </div>
</div>

<script>
  const API_URL = window.location.origin;
  let token = localStorage.getItem('token');
  let currentEditId = null;

  if (!token) window.location.href = '/login';

  async function fetchWithAuth(url, options = {}) {
    const res = await fetch(url, {
      ...options,
      headers: { ...options.headers, 'Authorization': `Bearer ${token}` }
    });
    if (res.status === 401) { localStorage.removeItem('token'); window.location.href = '/login'; }
    return res;
  }

  function showMessage(msg, isError = false) {
    const div = document.createElement('div');
    div.textContent = msg;
    div.style.cssText = `position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:${isError ? '#ef4444' : '#10b981'}; color:white; padding:10px 20px; border-radius:40px; z-index:1100; font-size:14px; white-space:nowrap;`;
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 3000);
  }

  async function loadDashboard() {
    try {
      const subRes = await fetchWithAuth(`${API_URL}/api/submissions`);
      const submissions = await subRes.json();
      const pending = submissions.filter(s => s.status === 'pending');
      const approved = submissions.filter(s => s.status === 'approved');
      
      document.getElementById('stats').innerHTML = `
        <div class="stat-card">⏳ قيد المراجعة: ${pending.length}</div>
        <div class="stat-card">✅ تمت الموافقة: ${approved.length}</div>
        <div class="stat-card">📋 الإجمالي: ${submissions.length}</div>
      `;
      
      let subHtml = `<table><thead><tr><th>الوجهة</th><th>المحافظة</th><th>فيديو</th><th>ملاحظات</th><th>إجراءات</th></tr></thead><tbody>`;
      pending.forEach(s => {
        subHtml += `<tr>
          <td>${escapeHtml(s.destinationName)}</td>
          <td>${escapeHtml(s.governorate)}</td>
          <td><video src="${s.videoUrl}" controls width="80"></video></td>
          <td>${escapeHtml(s.notes) || '-'}</td>
          <td><button class="approve" onclick="approve('${s.id}')">قبول</button><button class="reject" onclick="reject('${s.id}')">رفض</button></td>
        </tr>`;
      });
      if(pending.length===0) subHtml += '<tr><td colspan="5">لا توجد طلبات معلقة</td></tr>';
      subHtml += '</tbody></table>';
      document.getElementById('submissionsTable').innerHTML = subHtml;

      const signsRes = await fetch(`${API_URL}/api/signs`);
      const signs = await signsRes.json();
      let signsHtml = `<table><thead><tr><th>الوجهة</th><th>المحافظة</th><th>فيديو</th><th>إجراءات</th></tr></thead><tbody>`;
      signs.forEach(s => {
        signsHtml += `<tr>
          <td>${escapeHtml(s.destinationName)}</td>
          <td>${escapeHtml(s.governorate)}</td>
          <td><video src="${s.videoUrl}" controls width="80"></video></td>
          <td><button class="delete" onclick="deleteSign('${s.id}')">حذف</button><button class="edit" onclick="openEditModal('${s.id}', '${escapeHtml(s.destinationName)}', '${escapeHtml(s.governorate)}', '${escapeHtml(s.description || '')}', '${s.videoUrl}')">تعديل</button></td>
        </tr>`;
      });
      if(signs.length===0) signsHtml += '<tr><td colspan="4">لا توجد إشارات معتمدة</td></tr>';
      signsHtml += '</tbody></table>';
      document.getElementById('signsTable').innerHTML = signsHtml;
    } catch(err) { showMessage('خطأ في التحميل', true); }
  }

  function escapeHtml(str) { return str?.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]) || ''; }

  function openEditModal(id, name, gov, desc, videoUrl) {
    currentEditId = id;
    document.getElementById('editDestName').value = name;
    document.getElementById('editGovernorate').value = gov;
    document.getElementById('editDescription').value = desc;
    document.getElementById('currentVideoPreview').innerHTML = `<video src="${videoUrl}" controls width="100%"></video>`;
    document.getElementById('editModal').classList.add('active');
  }
  function closeEditModal() { document.getElementById('editModal').classList.remove('active'); currentEditId = null; }

  async function saveEdit() {
    const id = currentEditId;
    const newName = document.getElementById('editDestName').value;
    const newGov = document.getElementById('editGovernorate').value;
    const newDesc = document.getElementById('editDescription').value;
    const newVideo = document.getElementById('editVideo').files[0];
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    try {
      await fetchWithAuth(`${API_URL}/api/signs/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ destinationName: newName, governorate: newGov, description: newDesc }) });
      if(newVideo) {
        const fd = new FormData(); fd.append('video', newVideo);
        await fetchWithAuth(`${API_URL}/api/signs/${id}/video`, { method: 'PATCH', body: fd });
      }
      showMessage('تم التعديل بنجاح');
      closeEditModal();
      loadDashboard();
    } catch(e) { showMessage('فشل التعديل', true); }
    btn.disabled = false;
  }

  async function approve(id) { if(confirm('قبول؟')) { await fetchWithAuth(`${API_URL}/api/submissions/${id}/approve`, { method: 'POST' }); loadDashboard(); } }
  async function reject(id) { if(confirm('رفض؟')) { await fetchWithAuth(`${API_URL}/api/submissions/${id}/reject`, { method: 'POST' }); loadDashboard(); } }
  async function deleteSign(id) { if(confirm('حذف نهائي؟')) { await fetchWithAuth(`${API_URL}/api/signs/${id}`, { method: 'DELETE' }); loadDashboard(); } }
  async function uploadOfficialSign() {
    const dest = document.getElementById('newDest').value;
    const gov = document.getElementById('newGov').value;
    const vid = document.getElementById('newVideo').files[0];
    const desc = document.getElementById('newDesc').value;
    if(!dest || !vid) { showMessage('املأ البيانات واختار فيديو', true); return; }
    const fd = new FormData();
    fd.append('destinationName', dest); fd.append('governorate', gov); fd.append('video', vid); fd.append('description', desc);
    await fetchWithAuth(`${API_URL}/api/signs`, { method: 'POST', body: fd });
    showMessage('تم الرفع');
    document.getElementById('newDest').value = ''; document.getElementById('newVideo').value = ''; document.getElementById('newDesc').value = '';
    loadDashboard();
  }
  function logout() { localStorage.removeItem('token'); window.location.href = '/login'; }

  document.getElementById('editModal').addEventListener('click', (e) => { if(e.target === document.getElementById('editModal')) closeEditModal(); });
  loadDashboard();
</script>
</body>
</html>
