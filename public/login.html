<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>دخول المدير - إشارتك</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Cairo', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px; /* مسافة أمان للموبايل */
    }
    .login-card {
      background: white;
      border-radius: 32px;
      padding: 32px 24px; /* مساحة داخلية مناسبة */
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
    }
    h1 { 
      font-size: clamp(24px, 6vw, 32px); /* حجم خط يتناسب مع الشاشة */
      margin-bottom: 8px; 
      color: #1e293b; 
    }
    .sub { 
      color: #64748b; 
      margin-bottom: 28px; 
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      margin: 12px 0;
      border: 1px solid #cbd5e1;
      border-radius: 28px;
      font-size: 16px;
      font-family: inherit;
    }
    button {
      width: 100%;
      background: #2563eb;
      color: white;
      padding: 14px;
      border: none;
      border-radius: 40px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 16px;
      transition: background 0.2s;
    }
    button:active { background: #1d4ed8; } /* تأثير عند اللمس */
    .error { color: #dc2626; margin-top: 16px; text-align: center; font-size: 14px; }

    /* تحسينات للموبايل جدًا */
    @media (max-width: 480px) {
      .login-card { padding: 24px 20px; }
      input { padding: 12px 14px; }
    }
  </style>
</head>
<body>
<div class="login-card">
  <h1>🔐 دخول المدير</h1>
  <p class="sub">إشارتك - لوحة التحكم</p>
  <input type="text" id="username" placeholder="اسم المستخدم" autocomplete="off">
  <input type="password" id="password" placeholder="كلمة المرور">
  <button onclick="login()">تسجيل الدخول</button>
  <div class="error" id="errorMsg"></div>
</div>
<script>
  async function login() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('errorMsg');
    if (!username || !password) {
      errorDiv.innerText = 'يرجى إدخال اسم المستخدم وكلمة المرور';
      return;
    }
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('token', data.token);
        window.location.href = '/dashboard';
      } else {
        errorDiv.innerText = data.error || 'بيانات دخول خاطئة';
      }
    } catch (err) {
      errorDiv.innerText = 'خطأ في الاتصال بالخادم';
    }
  }
</script>
</body>
</html>
